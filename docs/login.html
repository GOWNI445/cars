
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Car Service Management System (CSMS) - Quick and easy scheduling for auto repairs and servicing.">
    <title>Login - CSMS</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
    <!-- Header Navigation -->
    <header>
        <div class="container navbar">
            <a href="index.html" class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
                CAR SERVICE MANAGEMENT SYSTEM
            </a>
            
            <ul class="nav-links">
                
                    <li><a href="index.html">Home</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html" class="btn-nav">Register</a></li>
                
            </ul>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="container">
        <!-- Success and Error Messages Framework -->
        

        
<div class="auth-box">
    <!-- Tabs Header -->
    <div style="display: flex; border-bottom: 1px solid var(--card-border); margin-bottom: 2rem;">
        <button type="button" id="tab-customer" onclick="switchTab('customer')" class="tab-btn active" style="flex: 1; padding: 0.75rem; background: none; border: none; color: var(--text-muted); font-weight: 600; font-family: inherit; font-size: 1rem; cursor: pointer; transition: var(--transition);">
            Customer Login
        </button>
        <button type="button" id="tab-admin" onclick="switchTab('admin')" class="tab-btn" style="flex: 1; padding: 0.75rem; background: none; border: none; color: var(--text-muted); font-weight: 600; font-family: inherit; font-size: 1rem; cursor: pointer; transition: var(--transition);">
            Admin Login
        </button>
    </div>

    <h2 id="login-title">Customer Login</h2>
    <p id="login-subtitle" class="subtitle">Log in to manage your car service dashboard</p>
    
    <form method="POST">
        <input type="hidden" name="csrfmiddlewaretoken" value="A45jkUUZdbDvhoU9rhEDXB6svb2ym22jDScgAVrnuyFaF7hzQLbCTgucCpT3GrVo">
        <input type="hidden" name="login_type" id="login_type" value="customer">
        
        

        
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" placeholder="Enter Username" required id="id_username">
                
            </div>
        
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" placeholder="Enter Password" required id="id_password">
                
            </div>
        

        <button type="submit" class="btn btn-primary btn-block mt-4">Login</button>
    </form>
    
    <p id="register-link-section" class="text-center mt-4" style="color: var(--text-muted); font-size: 0.9rem;">
        Don't have an account? <a href="register.html" style="color: var(--accent-primary); font-weight: 500;">Register here</a>
    </p>

    <!-- Quick Demo Logins for testing -->
    <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--card-border); text-align: center;">
        <div id="demo-section">
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.75rem;">Customer Quick Access (Demo):</p>
            <button type="button" onclick="loginAs('john@example.com', 'customerpassword')" class="btn btn-secondary btn-sm" style="background-color: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.2); color: var(--accent-primary);">
                Autofill & Login as Customer
            </button>
        </div>
    </div>

    <script>
        function switchTab(role) {
            const tabCustomer = document.getElementById('tab-customer');
            const tabAdmin = document.getElementById('tab-admin');
            const title = document.getElementById('login-title');
            const subtitle = document.getElementById('login-subtitle');
            const registerLink = document.getElementById('register-link-section');
            const demoSection = document.getElementById('demo-section');
            
            // Set login type hidden field
            const loginTypeField = document.getElementById('login_type');
            if (loginTypeField) {
                loginTypeField.value = role;
            }

            // Reset buttons styling
            tabCustomer.style.borderBottom = "2px solid transparent";
            tabCustomer.style.color = "var(--text-muted)";
            tabAdmin.style.borderBottom = "2px solid transparent";
            tabAdmin.style.color = "var(--text-muted)";

            if (role === 'admin') {
                tabAdmin.style.borderBottom = "2px solid #6366f1";
                tabAdmin.style.color = "var(--text-main)";
                title.innerText = 'Admin Portal Login';
                subtitle.innerText = 'Log in to access administrative operations';
                registerLink.style.display = 'none';
                demoSection.innerHTML = `
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.75rem;">Admin Quick Access (Demo):</p>
                    <button type="button" onclick="loginAs('admin@csms.com', 'adminpassword')" class="btn btn-secondary btn-sm" style="background-color: rgba(236, 72, 153, 0.1); border-color: rgba(236, 72, 153, 0.2); color: #ec4899;">
                        Autofill & Login as Admin
                    </button>
                `;
            } else {
                tabCustomer.style.borderBottom = "2px solid #6366f1";
                tabCustomer.style.color = "var(--text-main)";
                title.innerText = 'Customer Login';
                subtitle.innerText = 'Log in to manage your car service dashboard';
                registerLink.style.display = 'block';
                demoSection.innerHTML = `
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.75rem;">Customer Quick Access (Demo):</p>
                    <button type="button" onclick="loginAs('john@example.com', 'customerpassword')" class="btn btn-secondary btn-sm" style="background-color: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.2); color: var(--accent-primary);">
                        Autofill & Login as Customer
                    </button>
                `;
            }
        }

        // Initialize styled border on load for active class
        document.getElementById('tab-customer').style.borderBottom = "2px solid #6366f1";
        document.getElementById('tab-customer').style.color = "var(--text-main)";

        function loginAs(username, password) {
            const userInput = document.querySelector('input[name="username"]') || document.querySelector('input[type="text"]');
            const passwordInput = document.querySelector('input[type="password"]') || document.querySelector('input[name="password"]');
            if (userInput && passwordInput) {
                userInput.value = username;
                passwordInput.value = password;
                userInput.form.submit();
            }
        }
    </script>
</div>

    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Car Service Management System (CSMS). All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
